name: Build releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact-name: TCFLabelChange-windows
            package-command: npm run package:win
            artifact-path: release/TCFLabelChange.exe
          - os: macos-latest
            platform: macos
            artifact-name: TCFLabelChange-macos
            package-command: npm run package:mac
            artifact-path: release/TCFLabelChange.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.package-command }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30
